seed: 42

data:
  raw_expr_path: "data/raw/golub_expr.csv"
  raw_label_path: "data/raw/golub_labels.csv"
  processed_dir: "data/processed"
  n_top_genes: 2000
  variance_metric: "mad"
  log_transform: "none"
  batch_check_cols: []
  label_col: "cancer_type"
  sample_id_col: "sample_id"

dimensionality_reduction:
  pca_n_components: 30
  umap_n_neighbors: 15
  umap_min_dist: 0.1
  umap_random_state: 42

clustering:
  methods:
    - "hierarchical_ward"
    - "kmeans"
    - "gmm"
    - "consensus"
  k_range: [2, 3, 4, 5, 6, 7, 8]
  consensus_n_resamples: 100
  consensus_p_item: 0.8
  consensus_p_feature: 1.0
  consensus_random_state: 42

validation:
  bootstrap_n_iter: 100
  bootstrap_sample_frac: 0.8
  ari_threshold_pass: 0.70
  silhouette_threshold_pass: 0.60

biomarkers:
  test: "mannwhitneyu"
  fdr_method: "fdr_bh"
  fdr_threshold: 0.05
  logfc_threshold: 1.0
  top_n_report: 20

enrichment:
  gene_sets:
    - "KEGG_2021_Human"
    - "Reactome_2022"
    - "Hallmark_2020"
    - "GO_Biological_Process_2021"
  organism: "Human"
  min_size: 5
  max_size: 500
  fdr_threshold: 0.05

explainability:
  surrogate_model: "RandomForestClassifier"
  n_estimators: 300
  max_depth: null
  random_state: 42
  n_jobs: -1

report:
  title: "Cancer Subtype Discovery Report"
  author: "Ritik Arya & Prakhar Joshi"
  include_shap_summary: true
  include_methods_section: true
  output_path: "reports/final_report.pdf"

app:
  theme: "light"
  cache_ttl_seconds: 3600