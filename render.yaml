services:
  # Service 1: Original Streamlit Molecular Discovery Research Dashboard
  - type: web
    name: cancer-subtype-streamlit
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /_stcore/health

  # Service 2: FastAPI Research Data API + Mounted Responsive Frontend
  - type: web
    name: cancer-subtype-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.index:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
