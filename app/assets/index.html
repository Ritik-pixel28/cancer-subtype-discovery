<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Molecular Discovery</title><link rel="stylesheet" href="style.css"><style>@font-face{font-family:EditorialCondensed;src:url('./BarlowCondensed-Medium.ttf') format('truetype');font-display:swap}body{margin:0;background:#f3f2ed}html{scroll-behavior:smooth}</style><body><div id="landing-root"></div><script type="module">
const molecularModule = import('./molecule.js');
const send=(type,extra={})=>window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
let initialized=false,previous='';
function size(){let screenHeight=720;try{screenHeight=window.parent.innerHeight}catch{}document.documentElement.style.setProperty('--hero-height',Math.max(680,Math.min(screenHeight,1100))+'px');send('streamlit:setFrameHeight',{height:Math.ceil(document.getElementById('landing-root').getBoundingClientRect().height)})}
window.addEventListener('message',event=>{if(event.source!==window.parent || event.data?.type!=='streamlit:render')return;const args=event.data.args;if(previous===args.markup)return;previous=args.markup;document.getElementById('landing-root').innerHTML=args.markup;molecularModule.then(({startMolecule})=>startMolecule(args.dna)).catch(()=>{});size();document.fonts.ready.then(size)});
document.addEventListener('click',event=>{const link=event.target.closest('a');if(!link)return;const href=link.getAttribute('href');if(href?.startsWith('?view=')){event.preventDefault();link.setAttribute('aria-busy','true');link.textContent='Opening explorer…';const status=document.createElement('div');status.className='navigation-status';status.setAttribute('role','status');status.textContent='Opening research workspace…';document.body.appendChild(status);send('streamlit:setComponentValue',{value:new URLSearchParams(href).get('view'),dataType:'json'})}});
new ResizeObserver(size).observe(document.getElementById('landing-root'));window.addEventListener('resize',size);send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
